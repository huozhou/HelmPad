name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & sign release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION_NAME="${{ github.event.release.tag_name }}"
            VERSION_NAME="${VERSION_NAME#v}"
          else
            VERSION_NAME="0.0.1-dev"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName: $VERSION_NAME"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testReleaseUnitTest -PversionName=${{ steps.version.outputs.name }} --no-daemon

      - name: Assemble release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName=${{ steps.version.outputs.name }} --no-daemon
        # build aab
        # run: ./gradlew :app:assembleRelease :app:bundleRelease -PversionName=${{ steps.version.outputs.name }} --no-daemon

      - name: Wipe keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore/release.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helm-pad-release
          path: |
            app/build/outputs/apk/release/*.apk
            # app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            # app/build/outputs/bundle/release/*.aab
